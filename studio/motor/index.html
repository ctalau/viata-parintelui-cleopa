<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motorul Three.js · Școala Evlaviei</title>
  <link rel="stylesheet" href="/studio.css">
  <style>
    body { background: #f8efe2; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    #stage { position: relative; aspect-ratio: 16 / 9; background: #292929; border-radius: 14px; overflow: hidden; }
    #stage canvas { width: 100%; height: 100%; display: block; }
    .bar { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .bar input[type=range] { flex: 1; min-width: 160px; }
    .bar button, .bar a { padding: 8px 12px; border-radius: 8px; border: 1px solid #c9a982; background: #fff8ee; color: #4a2f22; text-decoration: none; font: inherit; }
    #info { color: #5a4334; margin: 8px 0; }
    ul { padding-left: 18px; }
  </style>
</head>
<body>
  <main>
    <p><a href="/">← Școala Evlaviei</a></p>
    <h1 id="title">Motorul Three.js</h1>
    <p id="info">Episodul se construiește în browser din personaje, decoruri și recuzită GLB reutilizabile și din descriptorul episode.json.</p>
    <div id="stage"><canvas id="picture" aria-label="Episodul randat în Three.js"></canvas></div>
    <audio id="sound" preload="metadata"></audio>
    <div class="bar">
      <button id="play" type="button">Redă</button>
      <input id="seek" type="range" min="0" step="0.01" value="0" aria-label="Momentul din episod">
      <span id="clock">0:00</span>
      <button id="full" type="button">Ecran complet</button>
      <a id="download" download>Descarcă MP4</a>
      <a id="descriptor">episode.json</a>
    </div>
    <h2>Capitole</h2>
    <ul id="chapters"></ul>
  </main>
  <script type="module" src="/motor.js"></script>
</body>
</html>
