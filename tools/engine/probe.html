<!doctype html><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<body style="margin:0;background:#fff"><canvas id="c" width="1200" height="800"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Character } from '/lib/engine/character.js';
import { armTrack } from '/lib/engine/arm25d.js';
const loader = new GLTFLoader();
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setClearColor(0xf3e6cf);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-6, 6, 4, -4, -100, 100);
camera.position.set(0, 0.6, 50);
const q = new URLSearchParams(location.search);
const ids = q.get('only') ? q.get('only').split(',') : ['costica', 'mama', 'mihai', 'tata'];
if (q.get('cam')) { const [cx, cy, half] = q.get('cam').split(',').map(Number); camera.left = -half * 1.5; camera.right = half * 1.5; camera.top = half; camera.bottom = -half; camera.position.set(cx, cy, 50); camera.updateProjectionMatrix(); }
let x = q.get('only') ? 0 : -4.5;
for (const id of ids) {
  const [gltf, meta] = await Promise.all([loader.loadAsync(`/assets/characters/${id}.glb`), fetch(`/assets/characters/${id}.json`).then((r) => r.json())]);
  const c = new Character(gltf, meta, { interior: true });
  c.root.position.set(x, 0, 0); c.root.scale.set(1, 1, 0.5);
  scene.add(c.root);
  // Test: Tata în prag (oprire), cartea lui Mihai (palma pe copertă), mâna la barbă.
  const p = meta.profile;
  const R = armTrack(p, 'R', [{ t: 0, wrist: [-0.46, 1.17], dir: [-0.20, 0.98] }]).at(0);
  const L = armTrack(p, 'L', [{ t: 0, wrist: [0.62, 0.42], dir: [-0.96, 0.24] }]).at(0);
  c.setArm('R', { rot: R.rot, len: R.len, depth: R.depth, elbow: R.elbow, hand: { pose: 'stop' } });
  c.setArm('L', { rot: L.rot, len: L.len, depth: L.depth, elbow: L.elbow, hand: { pose: 'grip' } });
  c.select('mouth_pose', 'A');
  c.apply();
  if (q.get('palms')) { c.parts.forEach((m) => { m.visible = false; }); for (const pm of Object.values(c.palms)) { pm.mesh.visible = true; console.error('palm parent', pm.mesh.parent.name, pm.mesh.parent.type, pm.mesh.parent.visible, pm.geometry.getAttribute('position').count); } }
  x += 3;
}
renderer.render(scene, camera);
window.gata = true;
</script>
